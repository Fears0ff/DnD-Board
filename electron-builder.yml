appId: local.dndboard.desktop
productName: DnD Board
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
asarUnpack:
  - dist/node_modules/**/*
npmRebuild: false
buildDependenciesFromSource: false
# Build CI artifacts only; never create a GitHub Release implicitly.
publish: null
beforePack: scripts/electron-before-pack.cjs
afterAllArtifactBuild: scripts/electron-after-all-artifact-build.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: DnD-Board-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DnD Board
